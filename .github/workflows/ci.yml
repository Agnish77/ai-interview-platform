name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint + Unit Tests ──────────────────────────────────────────────────────
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        run: npm install
        working-directory: backend

      - name: Run backend tests
        working-directory: backend
        env:
          MONGO_URI: mongodb://localhost:27017/test
          JWT_SECRET: test_secret_ci
          GOOGLE_API_KEY: dummy_key_for_tests
        run: npm test -- --forceExit

      - name: Install frontend deps
        run: npm install
        working-directory: frontend

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  # ── Docker Build ───────────────────────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t ai-interview-backend ./backend

      - name: Build frontend image
        run: docker build -t ai-interview-frontend ./frontend

  # ── E2E (main branch only) ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Playwright deps
        run: |
          npm install @playwright/test
          npx playwright install --with-deps chromium

      - name: Build & start Docker services
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'ci_test_secret_123' }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'ci_refresh_secret_123' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'dummy_key_for_e2e' }}
        run: |
          docker compose build
          docker compose up -d

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on http://localhost ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost/ > /dev/null 2>&1; then
              echo "Frontend is up!"
              break
            fi
            echo "Attempt $i/30 — not ready yet, waiting 5s..."
            sleep 5
          done
          curl -sf http://localhost/ || (echo "Frontend never became ready" && docker compose logs && exit 1)

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on http://localhost:3000/api/health ..."
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend is up!"
              break
            fi
            echo "Attempt $i/20 — not ready yet, waiting 5s..."
            sleep 5
          done
          curl -sf http://localhost:3000/api/health || (echo "Backend never became ready" && docker compose logs backend && exit 1)

      - name: Run E2E tests
        env:
          CI: "true"
          PLAYWRIGHT_TEST_BASE_URL: http://localhost
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop services
        if: always()
        run: docker compose down

  # ── Deploy (main only, after E2E) ──────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render Backend Deploy
        if: vars.RENDER_BACKEND_HOOK != ''
        run: curl -X POST ${{ vars.RENDER_BACKEND_HOOK }}

      - name: Trigger Vercel Frontend Deploy
        if: vars.VERCEL_DEPLOY_HOOK != ''
        run: curl -X POST ${{ vars.VERCEL_DEPLOY_HOOK }}
